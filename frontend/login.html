<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Resume Screening AI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="glass-card" style="max-width: 440px; width: 90%; padding: 40px; text-align: center; box-shadow: var(--shadow-lg);">
    <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.8rem; margin: 0 auto 16px;">
      <i class="fa-solid fa-brain"></i>
    </div>
    <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 6px;">Resume <span style="color: var(--primary);">Screening AI</span></h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px;">Sign in to access your recruitment workspace.</p>

    <form id="loginForm">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" class="form-control" placeholder="recruiter@company.com" required value="recruiter@company.com" />
      </div>

      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required value="demo1234" />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
        Sign In to Workspace <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
